name: Isolated iOS replay - saved app, no rebuild
on:
  pull_request:
    branches: [qa/full-commercial-mobile-journeys-20261027]
    paths:
      - '.github/workflows/native-ios-commercial-replay.yml'
      - '.maestro/qa-commercial-*.yml'
      - '.maestro/fixtures/**'
      - 'scripts/verify-native-maestro-selectors.cjs'
permissions:
  contents: read
  actions: read
jobs:
  ios-commercial-replay:
    if: ${{ github.event.pull_request.number == 389 }}
    # GitHub macOS 26 / Xcode 26.4 simulator accepted the app but the
    # Maestro XCTest driver never opened its local port (run 40605568363).
    # Use supported Xcode 16.4 / iOS 18.5 simulator for a separate
    # compatibility lane, retaining the exact archived QA app bytes.
    runs-on: macos-15
    timeout-minutes: 110
    concurrency:
      group: ios-independent-389
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      CI: '1'
      NODE_ENV: test
      AR_NATIVE_PLATFORM: ios
      AR_NATIVE_QA_LOCAL: '1'
      AR_NATIVE_COMMERCIAL_QA: '1'
      EXPO_PUBLIC_AR_NATIVE_QA: '1'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:4242
      EXPO_PUBLIC_REFERRALS_ENABLED: '1'
      FIREBASE_PROJECT_ID: demo-american-rider-qa
      GOOGLE_CLOUD_PROJECT: demo-american-rider-qa
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || vars.STRIPE_TEST_PUBLISHABLE_KEY || vars.STRIPE_PUBLISHABLE_KEY }}
      PORT: '4242'
      MARKET_STATUS: fl-miami-dade:active
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce no production account, no provider live keys, and exact QA source
        shell: bash
        run: |
          set -euo pipefail
          test "$AR_NATIVE_QA_LOCAL" = 1
          test "$GOOGLE_CLOUD_PROJECT" = demo-american-rider-qa
          test -z "$(printenv STRIPE_LIVE_SECRET_KEY || true)"
          test -z "$(printenv K_SERVICE || true)"
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "::error::Only STRIPE_TEST_SECRET_KEY permitted"; exit 1;; esac
          case "$STRIPE_PUBLISHABLE_KEY" in pk_test_*) ;; *) echo "::error::Matching STRIPE_TEST_PUBLISHABLE_KEY is not configured"; exit 1;; esac
          git rev-parse HEAD
      - name: Validate iOS selectors and isolated safety before device runs
        run: |
          node backend/native-qa-isolation.test.js
          node scripts/verify-native-maestro-selectors.cjs
      - name: Install app/backend and Firebase emulator dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend --omit=dev
          npm ci --prefix infra/rules-emulator
      - name: Start disposable Firebase Auth/Firestore emulators
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),config=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          config.emulators={...(config.emulators||{}),
            auth:{host:'127.0.0.1',port:9099},firestore:{host:'127.0.0.1',port:8080}};
          fs.writeFileSync('firebase-qa-only.generated.json',JSON.stringify(config));
          NODE
          ./infra/rules-emulator/node_modules/.bin/firebase emulators:start --only auth,firestore --project demo-american-rider-qa --config firebase-qa-only.generated.json > "$RUNNER_TEMP/firebase-qa.log" 2>&1 &
          for i in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:9099/emulator/v1/projects/demo-american-rider-qa/config >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9099/emulator/v1/projects/demo-american-rider-qa/config >/dev/null
      - name: Provision disposable Traveler and eligible-test Operator in LOCAL Firebase and Stripe TEST
        shell: bash
        run: |
          set -euo pipefail
          node backend/native-commercial-qa-fixture.cjs | tee "$RUNNER_TEMP/fixture-result.txt"
          grep -q 'QA_NATIVE_FIXTURES_READY=1' "$RUNNER_TEMP/fixture-result.txt" || exit 1
      - name: Start actual local American Rider API and prove Stripe TEST readiness
        shell: bash
        run: |
          set -euo pipefail
          node backend/server.js > "$RUNNER_TEMP/local-commercial-api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4242/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4242/health >/dev/null || { tail -50 "$RUNNER_TEMP/local-commercial-api.log"; exit 1; }
          node scripts/native-commercial-env-preflight.cjs
      - name: Install Maestro real-screen interaction runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Verify current code matches preserved iOS app before installation
        shell: bash
        run: |
          set -euo pipefail
          digest="$(node scripts/native-build-fingerprint.cjs)"
          test "$digest" = '33433a15789d4837c522dcef682584ee55e395d759893dc9b20c1ae265b9df15' || {
            echo '::error::Native binary fingerprint mismatch; refuse stale app'
            exit 1
          }
      - name: Recover exact archived simulator binary without building
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12778229774
          run-id: 40601800241
          github-token: ${{ github.token }}
          path: .qa-native-build-cache/ios
      - name: Verify pinned iOS testing environment before starting the driver
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          test -d "$DEVELOPER_DIR"
      - name: Verify SHA and install preserved app on iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-commercial-ios "$RUNNER_TEMP/qa-cached-ios"
          # download-artifact@v4 with artifact-ids (and no name) extracts
          # into a child directory named after the artifact. The prior
          # run 40605117546 tested the parent and failed before installation.
          # Verify the actual archive and checksum inside that child.
          APP_ARCHIVE="$GITHUB_WORKSPACE/.qa-native-build-cache/ios/commercial-qa-ios-simulator-app"
          test -s "$APP_ARCHIVE/AmericanRider.app.tgz"
          test -s "$APP_ARCHIVE/native.sha256"
          (cd "$APP_ARCHIVE" && shasum -a 256 -c native.sha256)
          tar -xzf "$APP_ARCHIVE/AmericanRider.app.tgz" -C "$RUNNER_TEMP/qa-cached-ios"
          test -d "$RUNNER_TEMP/qa-cached-ios/AmericanRider.app"
          SIM="$(xcrun simctl list -j devices available | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(z["udid"] for a in d.values() for z in a if z.get("isAvailable") and "iPhone" in z["name"]))')"
          echo "SIM_DEVICE=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl location "$SIM" set 25.7617,-80.1918
          xcrun simctl install "$SIM" "$RUNNER_TEMP/qa-cached-ios/AmericanRider.app"
      - name: Execute native iPhone Traveler and Operator paid journeys
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/qa-commercial-traveler.yml > artifacts/native-commercial-ios/traveler.log 2>&1 || { tail -75 artifacts/native-commercial-ios/traveler.log; mkdir -p artifacts/native-commercial-ios/maestro-debug; cp -R "$HOME/.maestro/tests/." artifacts/native-commercial-ios/maestro-debug/ 2>/dev/null || true; xcrun simctl io "$SIM_DEVICE" screenshot artifacts/native-commercial-ios/failure-screen.png || true; exit 1; }
          maestro test .maestro/qa-commercial-operator.yml > artifacts/native-commercial-ios/operator.log 2>&1 || { tail -75 artifacts/native-commercial-ios/operator.log; mkdir -p artifacts/native-commercial-ios/maestro-debug; cp -R "$HOME/.maestro/tests/." artifacts/native-commercial-ios/maestro-debug/ 2>/dev/null || true; xcrun simctl io "$SIM_DEVICE" screenshot artifacts/native-commercial-ios/failure-screen.png || true; exit 1; }
          node backend/native-commercial-qa-reconcile.cjs
      - name: Preserve iOS replay evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-replay-389-evidence
          path: artifacts/native-commercial-ios/
          retention-days: 14
          if-no-files-found: warn
      - name: Record certification boundary
        if: always()
        run: echo 'Only true native Traveler and Operator flows plus same-Travel Firestore and Stripe TEST capture/transfer reconciliation certify this isolated test. Commercial launch is separate.' >> "$GITHUB_STEP_SUMMARY"
