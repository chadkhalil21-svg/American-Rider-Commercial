name: Release Gate

on:
  pull_request:
  push:
    branches: [release/current]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Audit production backend dependencies
        run: npm audit --omit=dev --prefix backend
      - run: npm run check
      - name: Verify prelaunch synthetic paid Travel, native wallet source, pickup and Cloud Run contracts
        run: node scripts/prelaunch-synthetic-acceptance.cjs
      - name: Offline Census/BLS geographic source-integrity and 51-jurisdiction tests twice
        run: |
          python3 scripts/assemble-national-economic-geography.test.py
          python3 scripts/assemble-national-economic-geography.test.py
      - name: Export Expo web bundle
        run: npx expo export --platform web --output-dir dist-ci-web
      - name: Export Expo iOS bundle
        run: npx expo export --platform ios --output-dir dist-ci-ios
      - name: Export Expo Android bundle
        run: npx expo export --platform android --output-dir dist-ci-android
      - name: Read public tri-county admission status (no changes, no new authority)
        run: node scripts/check-public-tricounty-status.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix infra/rules-emulator
      - name: Run Firestore emulator rule suite
        run: npx --yes firebase-tools emulators:exec --only firestore "node infra/rules-emulator/messages.rules.test.mjs && node infra/rules-emulator/recovery-cursor.test.cjs && node infra/rules-emulator/monitor-load.test.cjs && node infra/rules-emulator/push-receipts.test.cjs && node infra/rules-emulator/provider-duplicate-intent.test.cjs && node infra/rules-emulator/travel-history-pagination.test.cjs"
