name: Cloud Run scheduling safety
on:
  pull_request:
    paths:
      - 'backend/server.js'
      - 'backend/firebase-admin.js'
      - 'backend/cloudrun-sweep-mode*'
      - 'backend/durable-maintenance*'
      - 'backend/Dockerfile'
      - '.github/workflows/cloud-run-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check startup and syntax
        run: |
          node --check backend/server.js
          node --check backend/firebase-admin.js
          node --check backend/cloudrun-sweep-mode.js
          node --check backend/durable-maintenance.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protected no-source Cloud Run scale-only logic and future deployment cap
        run: |
          python3 -m py_compile infra/cloud-run/scale-existing-paid-revision-20261101.py infra/cloud-run/deploy-existing-paid-source.py
          python3 -m unittest discover -s infra/cloud-run -p test_scale_existing_paid_revision_20261101.py
      - name: Verify scheduler fail-closed and durable cadence twice
        run: |
          node backend/cloudrun-sweep-mode.test.js
          node backend/durable-maintenance.test.js
