name: Audit TestFlight credential locations (metadata only)

# No secret payloads, no production mutation, no TestFlight submission.
on:
  push:
    branches: [release/current]
    paths:
      - '.github/workflows/audit-testflight-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  credential-location:
    if: ${{ github.ref == 'refs/heads/release/current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/623854974930/locations/global/workloadIdentityPools/github-production/providers/github
          service_account: ar-production-deployer@american-rider-35688.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check only Cloud Run environment NAMES and Secret Manager metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          PROJECT = 'american-rider-35688'
          REQUIRED = {'EXPO_TOKEN', 'ASC_API_KEY_BASE64'}
          def read_json(args):
              # Never emit command output or failure stderr: service metadata can
              # contain unrelated environment values. No secret payload access.
              try:
                  p = subprocess.run(args, capture_output=True, text=True, timeout=60)
                  return json.loads(p.stdout) if p.returncode == 0 else None
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  return None

          service = read_json([
              'gcloud', 'run', 'services', 'describe',
              'american-rider-api-production', '--region=us-east1',
              '--project=' + PROJECT, '--format=json'
          ])
          if service is None:
              print('Cloud Run environment metadata: not readable')
          else:
              templates = [
                  service.get('spec', {}).get('template', {}).get('spec', {}),
                  service.get('template', {}),
              ]
              envs = [e for t in templates for c in t.get('containers', [])
                      for e in c.get('env', []) if isinstance(e, dict)]
              by_name = {e.get('name'): e for e in envs}
              for name in sorted(REQUIRED):
                  entry = by_name.get(name)
                  if not entry:
                      state = 'not referenced by API service'
                  elif entry.get('valueFrom') or entry.get('valueSource'):
                      state = 'referenced as secret (metadata only)'
                  else:
                      state = 'environment variable exists (not usable by GitHub)'
                  print('Cloud Run ' + name + ': ' + state)

          secrets = read_json(['gcloud', 'secrets', 'list',
                               '--project=' + PROJECT, '--format=json(name)'])
          if not isinstance(secrets, list):
              print('Google Secret Manager inventory: NOT VERIFIED (metadata access denied or unavailable)')
          else:
              names = {str(x.get('name', '')).split('/')[-1] for x in secrets
                       if isinstance(x, dict)}
              for expected in sorted(REQUIRED):
                  exact = expected in names or expected.lower().replace('_', '-') in names
                  print('Secret Manager ' + expected + ': ' +
                        ('name found (value NOT checked)' if exact else
                         'no exact-name match (aliases possible)'))
              aliases = sorted(n for n in names
                               if any(w in n.lower() for w in
                                      ('expo', 'eas', 'apple', 'testflight', 'app-store', 'app_store', 'asc-')))
              print('Secret Manager possible mobile-credential aliases: ' +
                    str(len(aliases)) + ' (names/values not printed)')

          print('No credentials or private keys were accessed, printed, or copied.')
          PY
