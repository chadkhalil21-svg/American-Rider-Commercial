name: Cloud Run staging (manual, private)

# NEVER a push/deploy-to-production job. This only deploys to a distinct
# staging GCP project with test-mode payment keys, no public ingress.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-staging-only
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: cloud-run-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject accidental production target
        run: |
          test "${{ github.ref }}" = "refs/heads/release/current"
          echo "Only the private American Rider staging project is permitted."
      # A Workload Identity provider name and service account email are NOT
      # secret keys. Defining these public IDs here eliminates four redundant
      # owner-entered GitHub settings while retaining short-lived OIDC auth.
      # Pool/provider and account were verified in founder Cloud Shell images.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/926320586690/locations/global/workloadIdentityPools/github-staging/providers/github
          service_account: ar-staging-deployer@american-rider-staging-2026.iam.gserviceaccount.com
      - uses: google-github-actions/deploy-cloudrun@v2
        id: deploy
        with:
          service: american-rider-api-staging
          project_id: american-rider-staging-2026
          region: us-east1
          source: ./backend
          flags: >-
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --cpu=1
            --memory=1Gi
            --concurrency=20
            --service-account=ar-staging-runtime@american-rider-staging-2026.iam.gserviceaccount.com
          env_vars: |
            NODE_ENV=production
            DEPLOYMENT_MODE=test
            AR_EXTERNAL_SCHEDULER=1
          secrets: |
            SCHEDULER_TOKEN=ar-staging-scheduler-token:latest
      - name: Explain the private follow-up verification
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Staging service deployed privately."
          echo "It is not production. No Stripe webhook, public application or live market traffic was redirected."
          echo "Set up an OIDC-authenticated minute Cloud Scheduler job to POST /scheduled/sweep, with the configured secret header."
          echo "Verify authorized health, clock cadence and full test-mode payment lifecycle before any production work."
