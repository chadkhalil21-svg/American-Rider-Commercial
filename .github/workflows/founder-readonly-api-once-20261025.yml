name: Founder read-only API exact-release deployment (one time)
# Founder-approved code-only production update. Never changes an entitlement,
# Stripe key, payment switch, scheduler, recruiter settings, or Founder UID.
on:
  push:
    branches: [release/current]
    paths:
      - 'ops/activation/founder-readonly-api-codeonly-20261025.approved'

permissions:
  contents: read
  id-token: write

concurrency:
  group: american-rider-paid-cloudrun-source
  cancel-in-progress: false

jobs:
  founder-readonly-code-only:
    if: ${{ github.ref == 'refs/heads/release/current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: american-rider-commercial-live
    env:
      FOUNDER_CONFIRM: DEPLOY_EXISTING_PAID_CODE_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited backend test dependencies
        run: npm ci --prefix backend --ignore-scripts
      - name: Exact one-time code-only Founder approval and current release gate
        shell: bash
        run: |
          set -euo pipefail
          MARKER=ops/activation/founder-readonly-api-codeonly-20261025.approved
          test -f "$MARKER"
          grep -Fxq 'FOUNDER_APPROVED=DEPLOY_EXISTING_PAID_CODE_ONLY' "$MARKER"
          grep -Fxq 'FEATURE=FOUNDER_READONLY_API' "$MARKER"
          test "$(wc -l < "$MARKER")" -eq 2
          test "$GITHUB_REF" = 'refs/heads/release/current'
          git fetch origin release/current --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          node backend/founder-readonly-access.test.js
          node backend/paid-cloudrun-activation.test.js
          node backend/booking-readiness.test.js
          node backend/commercial-economics.test.js
          node backend/recruiter-commission-ledger.test.js
          node backend/corporate-website.test.js
          python3 -m py_compile infra/cloud-run/deploy-existing-paid-source.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/623854974930/locations/global/workloadIdentityPools/github-production/providers/github
          service_account: ar-production-deployer@american-rider-35688.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Promote exact read-only code with original secrets and rollback safeguards
        shell: bash
        run: python3 infra/cloud-run/deploy-existing-paid-source.py
