name: Reproduce Build 48 JavaScript startup on iOS Simulator (no TestFlight)
on:
  push:
    branches: [diagnostic/build48-react-native-startup-20261021]
    paths: ['.github/workflows/diagnose-build48-ios-simulator.yml']
permissions:
  contents: read
jobs:
  native-cold-launch:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Isolate exactly the Build 48 commercial source
        run: |
          git fetch --depth=1 origin e6a6a6a4ba4289887de54018578161e25e8d99b8
          git checkout --detach e6a6a6a4ba4289887de54018578161e25e8d99b8
          test "$(git rev-parse HEAD)" = e6a6a6a4ba4289887de54018578161e25e8d99b8
          echo "EXACT_BUILD_48_SOURCE_REPRODUCTION_CONFIRMED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and prepare native sources without EAS or signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          npm ci --no-audit --no-fund
          CI=1 npx expo prebuild --platform ios --non-interactive --no-install > /tmp/prebuild.log 2>&1 || {
            tail -n 75 /tmp/prebuild.log; exit 1;
          }
          cd ios
          pod install > /tmp/pod-install.log 2>&1 || { tail -n 80 /tmp/pod-install.log; exit 1; }
          echo NATIVE_PROJECT_AND_PODS_PREPARED
      - name: Create clean iOS simulator and boot (fail separately if Apple's runtime cannot start)
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          valid=[x for x in runtimes if x.get('isAvailable') and x.get('identifier','').endswith('iOS-26-4')]
          if not valid:valid=[x for x in runtimes if x.get('isAvailable') and 'iOS' in x.get('identifier','')]
          if not valid:raise SystemExit('BLOCKED_NO_IOS_RUNTIME')
          runtime=valid[0]['identifier']
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          validtypes=[x for x in devices if 'iPhone' in x.get('name','')]
          if not validtypes:raise SystemExit('BLOCKED_NO_IPHONE_DEVICE_TYPE')
          d=next((x for x in validtypes if '17 Pro' in x['name']), validtypes[0])
          udid=subprocess.check_output(['xcrun','simctl','create','AmericanRiderColdLaunchCI',d['identifier'],runtime],text=True).strip()
          print('FRESH_SIMULATOR',d['name'],runtime)
          try:
            subprocess.run(['xcrun','simctl','boot',udid],check=True,timeout=70)
            subprocess.run(['xcrun','simctl','bootstatus',udid,'-b'],check=True,timeout=210)
          except (subprocess.CalledProcessError,subprocess.TimeoutExpired) as err:
            print('BLOCKED_HOSTED_APPLE_SIMULATOR_RUNTIME',type(err).__name__)
            raise SystemExit(78)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('udid='+udid+'\n')
          print('FRESH_SIMULATOR_BOOT_PASSED')
          PY
      - name: Build exact Build 48 native Release code using Xcode directly
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://american-rider-api-production-623854974930.us-east1.run.app
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "BUILDING_RELEASE_SCHEME=$scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ARBuild48Derived" CODE_SIGNING_ALLOWED=NO \
            build > /tmp/native-build48-xcode.log 2>&1 || {
              echo 'NATIVE_COMPILE_ERROR_LINES'
              grep -E 'error:|BUILD FAILED|fatal error:|** BUILD' /tmp/native-build48-xcode.log | tail -n 75 | cut -c1-340 || true
              tail -n 35 /tmp/native-build48-xcode.log | cut -c1-340
              exit 1
            }
          echo NATIVE_RELEASE_BUILD_PASSED
      - name: Install and run app directly via simctl and inspect startup exceptions
        env:
          CI: '1'
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.boot.outputs.udid }}"
          app="$(find "$RUNNER_TEMP/ARBuild48Derived/Build/Products/Release-iphonesimulator" -maxdepth 2 -name '*.app' -type d | grep -v 'ExpoWidgets' | head -n 1)"
          test -n "$app"
          xcrun simctl install "$udid" "$app"
          (xcrun simctl spawn "$udid" log stream --style compact --level debug \
            --predicate 'eventMessage CONTAINS[c] "Unhandled JS Exception" OR eventMessage CONTAINS[c] "RCTFatal" OR eventMessage CONTAINS[c] "firebase/native-persistence-unavailable" OR process CONTAINS[c] "AmericanRider"' > /tmp/native-launch-console.log 2>&1) &
          logger_pid=$!
          sleep 3
          echo NATIVE_LAUNCH_ATTEMPT
          xcrun simctl launch "$udid" com.americanrider.app || true
          sleep 15
          xcrun simctl launch "$udid" com.americanrider.app || true
          sleep 10
          kill "$logger_pid" 2>/dev/null || true
          echo 'NATIVE_STARTUP_EXCEPTION_CANDIDATES_REDACTED'
          grep -Ei 'Unhandled JS Exception|RCTFatal|firebase/native-persistence|TypeError|ReferenceError|Invariant Violation|Terminating app' /tmp/native-launch-console.log | \
            sed -E 's/(AIza|sk_live_|pk_live_)[^ ]+/[REDACTED]/g' | tail -n 36 | cut -c1-310 || true
          echo 'SIMULATOR_ONLY_NO_TESTFLIGHT_NO_CHARGE_NO_RELEASE_UPDATE'
