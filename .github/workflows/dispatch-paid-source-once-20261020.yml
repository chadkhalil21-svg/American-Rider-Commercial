name: One-time founder-authorized existing production source update

# This helper only dispatches the EXISTING manually-confirmed protected workflow.
# Real deploy, exact head assertion, no-traffic safety, paid smoke and rollback remain in that workflow.
on:
  push:
    branches: [ci/one-time-controlled-paid-source-dispatch-20261020]
    paths: ['.github/workflows/dispatch-paid-source-once-20261020.yml']

permissions:
  actions: write
  contents: read

jobs:
  request-controlled-deployment:
    if: ${{ github.ref == 'refs/heads/ci/one-time-controlled-paid-source-dispatch-20261020' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request existing protected Cloud Run update once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint='https://api.github.com/repos/chadkhalil21-svg/American-Rider-Commercial/actions/workflows/cloud-run-update-paid-source.yml/dispatches'
          body=json.dumps({'ref':'release/current','inputs':{'confirmation':'DEPLOY_EXISTING_PAID_CODE_ONLY'}}).encode()
          request=urllib.request.Request(endpoint, data=body, method='POST', headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json'})
          with urllib.request.urlopen(request, timeout=25) as response:
              if response.status != 204:
                  raise RuntimeError('Existing protected workflow was not accepted')
          print('Requested the existing protected source updater on release/current. No direct deployment or payment action in this helper.')
          PY
