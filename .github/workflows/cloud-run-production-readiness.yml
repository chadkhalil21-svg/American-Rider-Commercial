name: Audit real American Rider Google Cloud production (read only)

# Establish recurring Google Cloud observability from connected GitHub, avoiding
# repeated iPad Cloud Shell copying. Audit each release and once per day. No production mutations or provider secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - release/current
  schedule:
    - cron: '23 12 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: american-rider-production-read-only-audit
  cancel-in-progress: false

jobs:
  google-production-metadata:
    if: ${{ github.ref == 'refs/heads/release/current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exact release sources
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only audit unit tests
        run: python3 -m unittest discover -s infra/cloud-run -p test_read_only_production_audit.py
      - name: Read-only revision-status unit tests
        run: python3 -m unittest discover -s infra/cloud-run -p test_revision_status_readonly.py
      - name: Federated GitHub authentication (no downloaded Google keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/623854974930/locations/global/workloadIdentityPools/github-production/providers/github
          service_account: ar-production-deployer@american-rider-35688.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect REAL production Cloud Run, signing-key BINDINGS and paused scheduler
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        run: python3 infra/cloud-run/read-only-production-audit.py
      - name: Explain most recent Cloud Run revision failure without changing traffic
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        run: python3 infra/cloud-run/revision-status-readonly.py
      - name: Verify LIVE serving Cloud Run instance and concurrency ceilings (READ ONLY)
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        run: |
          python3 -m unittest discover -s infra/cloud-run -p test_scale_capacity_readonly.py
          python3 infra/cloud-run/scale-capacity-readonly.py
      - name: Read serving revision no-build finance/referral feature gates (READ ONLY)
        shell: bash
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          def read(*args):
              return json.loads(subprocess.check_output(['gcloud',*args,'--format=json'],timeout=60))
          service=read('run','services','describe','american-rider-api-production',
                       '--project=american-rider-35688','--region=us-east1')
          rows=service.get('status',{}).get('traffic',[])
          serving=[t['revisionName'] for t in rows if t.get('percent')==100 and t.get('revisionName')]
          if len(serving)!=1:raise SystemExit('STOP: exactly one 100%-traffic revision required')
          revision=read('run','revisions','describe',serving[0],
                        '--project=american-rider-35688','--region=us-east1')
          spec=revision.get('spec',{})
          containers=spec.get('containers',[]) or spec.get('template',{}).get('spec',{}).get('containers',[])
          if not containers:raise SystemExit('STOP: unable to read exact serving revision env')
          env={entry.get('name'):entry.get('value') for entry in containers[0].get('env',[]) if 'value' in entry}
          groups={
            'Operator referral enrollment prerequisites':[
              'AR_REFERRALS_ENABLED','AR_RECRUITER_PROGRAM_ENABLED',
              'AR_RECRUITER_WEB_REFERRAL_VERIFIED'],
            'Referral finance safeguards':[
              'AR_RECRUITER_FINANCE_ENABLED','AR_RECRUITER_REWARDS_ENABLED',
              'AR_RECRUITER_STRIPE_PAYOUTS_ENABLED',
              'AR_RECRUITER_OPERATOR_SHARED_PAYOUT_ENABLED',
              'AR_RECRUITER_MARGIN_GUARANTEE_ENABLED'],
            'Operator-paid Connect fee safeguards':[
              'CONNECT_FEE_REPORT_AUTOMATION_ENABLED','CONNECT_VERIFIED_FEE_RECOVERY'],
            'Optional manual withdrawals':[
              'CONNECT_OPERATOR_CHOICE_PAYOUTS_VERIFIED',
              'CONNECT_MANUAL_REFERRAL_RECONCILIATION_VERIFIED']
          }
          print('READ ONLY, CURRENT 100%-TRAFFIC CLOUD RUN REVISION:',serving[0])
          for label,keys in groups.items():
              print(label+':')
              for key in keys:
                  value=env.get(key)
                  if value is None:state='not configured'
                  elif value in ('1','true','enabled'):state='enabled'
                  else:state='not enabled'
                  print('  '+key+': '+state)
          interval=env.get('CONNECT_STANDARD_PAYOUT_INTERVAL','weekly (default)')
          print('Payout schedule configured:',interval if interval in ('weekly','daily','manual','weekly (default)') else 'custom/unknown')
          print('No settings or financial records changed; flags alone do NOT prove fee evidence, consent, or bank payout availability.')
          PY
      - name: Confirm currently serving production API matches release (READ ONLY)
        shell: bash
        env:
          # Read-only check compares /health.commit with this checked-out release
          # and checks payment readiness but never executes a charge or a sweep.
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The original activate-paid-production.py VERIFY only applies BEFORE
          # cutover: its requirement for a private API and PAUSED scheduler is
          # correctly false after a successful commercial activation. Do not
          # call that pre-activation verifier on an already-public paid service.
          if node scripts/verify-store-cloudrun-api.cjs; then
            echo '✅ Current Google Cloud Run release is serving, live and store-build ready. This does not certify device, insurer, or store review.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ Public production API is not yet proven to serve this exact GitHub release and satisfy store-build readiness. Verify GCP release source and provider status before submitting.' >> "$GITHUB_STEP_SUMMARY"
            echo 'No Cloud Run, Stripe, Render, Scheduler or store configuration was changed.'
          fi
