name: Audit real American Rider Google Cloud production (read only)

# Establish recurring Google Cloud observability from connected GitHub, avoiding
# repeated iPad Cloud Shell copying. Audit each release and once per day. No production mutations or provider secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - release/current
  schedule:
    - cron: '23 12 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: american-rider-production-read-only-audit
  cancel-in-progress: false

jobs:
  google-production-metadata:
    if: ${{ github.ref == 'refs/heads/release/current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exact release sources
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only audit unit tests
        run: python3 -m unittest discover -s infra/cloud-run -p test_read_only_production_audit.py
      - name: Read-only revision-status unit tests
        run: python3 -m unittest discover -s infra/cloud-run -p test_revision_status_readonly.py
      - name: Federated GitHub authentication (no downloaded Google keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/623854974930/locations/global/workloadIdentityPools/github-production/providers/github
          service_account: ar-production-deployer@american-rider-35688.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect REAL production Cloud Run, signing-key BINDINGS and paused scheduler
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        run: python3 infra/cloud-run/read-only-production-audit.py
      - name: Explain most recent Cloud Run revision failure without changing traffic
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        run: python3 infra/cloud-run/revision-status-readonly.py
      - name: Exact real-money launch prerequisites (READ ONLY, reports blockers)
        env:
          CLOUDSDK_CORE_PROJECT: american-rider-35688
        shell: bash
        run: |
          set -euo pipefail
          # VERIFY reads ONLY Cloud Run, Scheduler, IAM policy and Stripe secret
          # VERSION METADATA. It does not read secret content or deploy/charge money.
          # Commercial blockers are expected before launch; record them as a
          # status report rather than treating a successful audit as a failed CI.
          if python3 infra/cloud-run/activate-paid-production.py VERIFY; then
            echo '✅ Paid Cloud Run prerequisites READY; live cutover still requires explicit founder approval.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ Paid Cloud Run prerequisites remain BLOCKED; inspect the safe BLOCKED lines above.' >> "$GITHUB_STEP_SUMMARY"
            echo 'No Cloud Run, Stripe, Render, Scheduler or App Store configuration was changed.'
          fi
