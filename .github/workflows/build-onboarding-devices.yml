name: Build first-store Google backend onboarding testers (no money)

# Internal iOS/Android device builds, no App Store / Google Play publishing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD_INTERNAL to run Expo onboarding device builds after Google public API is healthy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: american-rider-onboarding-internal-builds
  cancel-in-progress: false

jobs:
  build-devices:
    if: ${{ github.ref == 'refs/heads/release/current' && inputs.confirm == 'BUILD_INTERNAL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Exact release source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require existing owner Expo token
        shell: bash
        run: test -n "$EXPO_TOKEN" || { echo 'Missing configured EXPO_TOKEN'; exit 1; }
      - name: Install exact app dependencies
        run: npm ci --ignore-scripts
      - name: Confirm REAL public Google Firebase backend with money disabled
        run: node scripts/verify-public-onboarding-api.cjs
      - name: Build internally installable iOS or Android
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform "${{ matrix.platform }}" --profile prelaunch-onboarding --non-interactive --wait --json > "$RUNNER_TEMP/onboarding-build.json"
          node - "$RUNNER_TEMP/onboarding-build.json" <<'NODE'
          const fs=require('node:fs');
          const json=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const b=Array.isArray(json)?json[0]:json;
          if(!b?.id||String(b.status).toLowerCase()!=='finished')throw Error('Expo build was not confirmed finished');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Internal onboarding candidate\n\nPlatform: ${{ matrix.platform }}\n\nExact source: '+
            process.env.GITHUB_SHA+'\n\nEAS build ID: '+b.id+
            '\n\n**Internal testing only. Not public in App Store or Play. Money disabled on Google API.**\n');
          console.log('EAS build completed:',b.id);
          NODE
