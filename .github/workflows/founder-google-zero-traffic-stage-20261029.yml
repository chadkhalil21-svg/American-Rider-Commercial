name: Founder Google access - stage verified Cloud Run revision safely

# Founder explicitly starts this from GitHub Actions. Never change production
# traffic or invoke payout/refund/market mutations in this workflow.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type STAGE_FOUNDER_GOOGLE to build a zero-traffic revision'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: american-rider-founder-stage-without-traffic
  cancel-in-progress: false

jobs:
  stage-founder:
    if: ${{ github.ref == 'refs/heads/release/current' && inputs.confirmation == 'STAGE_FOUNDER_GOOGLE' }}
    runs-on: ubuntu-latest
    environment: american-rider-commercial-live
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Founder identity and scoped-command acceptance
        shell: bash
        run: |
          set -euo pipefail
          node backend/founder-google-ops-scopes.test.js
          node backend/founder-command-services.test.js
          node backend/chatgpt-mcp.test.js
      - name: Federated Google Cloud authentication (no user key pasted)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/623854974930/locations/global/workloadIdentityPools/github-production/providers/github
          service_account: ar-production-deployer@american-rider-35688.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check live service and Founder prerequisites without exposing secret values
        shell: bash
        env:
          FOUNDER_UID: ${{ secrets.AR_FOUNDER_FIREBASE_UID }}
        run: |
          set -euo pipefail
          if [[ ! "${FOUNDER_UID:-}" =~ ^[A-Za-z0-9_-]{6,128}$ ]]; then
            echo "::error::Approved Google Account Reference missing. Set the protected GitHub Actions secret AR_FOUNDER_FIREBASE_UID using the reference displayed after Google sign-in at americanrider.tech/founder/."
            exit 1
          fi
          set -euo pipefail
          gcloud run services describe american-rider-api-production --region=us-east1 --project=american-rider-35688 --format=json > /tmp/ar-service.json
          python3 - <<'PY'
          import json,sys
          s=json.load(open('/tmp/ar-service.json'))
          env=s.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[{}])[0].get('env',[])
          if not env:
              env=s.get('template',{}).get('containers',[{}])[0].get('env',[])
          names={v.get('name') for v in env}
          required={'OPS_USERS','OPS_SESSION_SECRET','OPS_MFA_SECRETS','AR_RECRUITER_FOUNDER_USERS'}
          missing=required-names
          if missing:
              print('BLOCKED: missing existing Founder identity/session bindings: '+','.join(sorted(missing)))
              sys.exit(1)
          traffic=s.get('status',{}).get('traffic') or s.get('traffic') or []
          if not traffic or sum(int(t.get('percent') or 0) for t in traffic)!=100:
              print('BLOCKED: live service traffic allocation is not verified')
              sys.exit(1)
          print('PASS: existing Founder identity bindings present; no values printed. Live traffic remains unchanged.')
          PY
      - name: Build exact release as a new Google Cloud revision with ZERO customer traffic
        shell: bash
        env:
          FOUNDER_UID: ${{ secrets.AR_FOUNDER_FIREBASE_UID }}
        run: |
          set -euo pipefail
          gcloud run deploy american-rider-api-production \
            --project=american-rider-35688 \
            --region=us-east1 \
            --source=./backend \
            --no-traffic \
            --update-env-vars="AR_FOUNDER_FIREBASE_UIDS=${FOUNDER_UID},AR_FOUNDER_GOOGLE_OPS_ENABLED=1,AR_RELEASE_COMMIT=${GITHUB_SHA}" \
            --quiet
      - name: Verify actual revision READY and still ZERO traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe american-rider-api-production \
            --project=american-rider-35688 --region=us-east1 --format=json > /tmp/ar-stage-service.json
          CREATED="$(python3 - <<'PY'
          import json
          s=json.load(open('/tmp/ar-stage-service.json'))
          print((s.get('status') or {}).get('latestCreatedRevisionName') or '')
          PY
          )"
          if [[ ! "$CREATED" =~ ^american-rider-api-production-[A-Za-z0-9-]+$ ]]; then
            echo "::error::Cloud Run did not disclose a valid new revision name"; exit 1
          fi
          gcloud run revisions describe "$CREATED" \
            --project=american-rider-35688 --region=us-east1 --format=json > /tmp/ar-stage-revision.json
          python3 - <<'PY'
          import json,sys
          service=json.load(open('/tmp/ar-stage-service.json'))
          revision=json.load(open('/tmp/ar-stage-revision.json'))
          status=service.get('status') or {}
          traffic=status.get('traffic') or service.get('traffic') or []
          created=status.get('latestCreatedRevisionName')
          conditions=(revision.get('status') or {}).get('conditions') or []
          ready=any(c.get('type')=='Ready' and str(c.get('status')).lower()=='true' for c in conditions)
          if not created or not ready:
              print('BLOCKED: new revision not READY');sys.exit(1)
          if any(t.get('revisionName')==created and int(t.get('percent') or 0)>0 for t in traffic):
              print('BLOCKED: staged revision unexpectedly received customer traffic');sys.exit(1)
          if sum(int(t.get('percent') or 0) for t in traffic)!=100:
              print('BLOCKED: customer traffic is not fully accounted for');sys.exit(1)
          containers=(revision.get('spec') or {}).get('containers') or [{}]
          mapping={v.get('name'):v.get('value') for v in containers[0].get('env',[])}
          if mapping.get('AR_FOUNDER_GOOGLE_OPS_ENABLED')!='1' or not mapping.get('AR_FOUNDER_FIREBASE_UIDS'):
              print('BLOCKED: revision missing the Founder Google allowlist');sys.exit(1)
          print('PASS: actual revision READY at 0%, old service remains at 100%.')
          print('Staged revision:',created)
          PY
          echo "Founder code staged at 0%: not activated for customers or payouts." >> "$GITHUB_STEP_SUMMARY"
