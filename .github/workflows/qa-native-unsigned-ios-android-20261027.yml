name: Native iPhone and Android emulator smoke for pinned candidate

# Isolated unsigned native smoke for the exact candidate. No App Store upload,
# no production credentials, no commercial booking, and no fabricated accounts.
on:
  pull_request:
    branches: [release/current]
    paths:
      - '.github/workflows/qa-native-unsigned-ios-android-20261027.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned-simulator:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: http://localhost:4242
      EXPO_PUBLIC_REFERRALS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Enforce isolation and exact candidate identity
        run: |
          test "$EXPO_PUBLIC_API_URL" = "http://localhost:4242"
          test "$(node -p "require('./app.json').expo.ios.bundleIdentifier")" = "com.americanrider.app"
          git rev-parse HEAD
      - name: Install pinned app dependencies and generate native iOS project
        run: |
          npm ci
          npx expo prebuild --clean --platform ios --non-interactive
          test -d ios/AmericanRider.xcworkspace
      - name: Pick and boot an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices --json > "$RUNNER_TEMP/simulators.json"
          UDID="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))['devices']
          for devices in data.values():
              for d in devices:
                  if 'iPhone' in d['name'] and d['state'] in ('Shutdown','Booted') and d.get('isAvailable',True):
                      print(d['udid']);sys.exit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Compile actual unsigned Release iPhone simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/AmericanRider.xcworkspace -scheme AmericanRider \
            -configuration Release -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ARDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > "$RUNNER_TEMP/ios-native-build.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/ios-native-build.log"; exit 1;
            }
          APP="$RUNNER_TEMP/ARDerivedData/Build/Products/Release-iphonesimulator/AmericanRider.app"
          test -d "$APP"
          echo "IOS_APP=$APP" >> "$GITHUB_ENV"
      - name: Inspect built Info.plist, install, launch and open real iPhone URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$IOS_APP/Info.plist" <<'PY'
          import plistlib,sys
          p=plistlib.load(open(sys.argv[1],'rb'))
          groups=p.get('CFBundleURLTypes',[])
          schemes={s for group in groups for s in group.get('CFBundleURLSchemes',[])}
          assert 'americanrider' in schemes, 'Built iOS application lacks native URL scheme'
          assert any(s.startswith('com.googleusercontent.apps.') for s in schemes), 'Google callback scheme missing'
          assert p.get('CFBundleIdentifier')=='com.americanrider.app', 'Wrong native app identity'
          print('PASS: actual built iPhone Info.plist contains American Rider + Google callback schemes')
          PY
          xcrun simctl install "$SIM_UDID" "$IOS_APP"
          xcrun simctl launch "$SIM_UDID" com.americanrider.app
          mkdir -p artifacts/ios-native
          xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-native/launch.png
          xcrun simctl openurl "$SIM_UDID" 'americanrider:///join'
          xcrun simctl openurl "$SIM_UDID" 'americanrider:///join?r=QANATIVEONLY&role=traveler'
          xcrun simctl openurl "$SIM_UDID" 'americanrider:///operator/qualify'
          xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-native/route-opening.png
          echo 'PASS iPhone native install/launch/deep-link smoke; no signed-device sign-in or paid journeys asserted'
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: american-rider-unsigned-iphone-smoke
          path: artifacts/ios-native/
          if-no-files-found: ignore

  android-unsigned-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: http://10.0.2.2:4242
      EXPO_PUBLIC_REFERRALS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Configure isolated native build
        run: |
          test "$EXPO_PUBLIC_API_URL" = "http://10.0.2.2:4242"
          test "$(node -p "require('./app.json').expo.android.package")" = "com.americanrider.app"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile the actual unsigned Android release APK
        run: |
          npm ci --ignore-scripts
          npx expo prebuild --clean --platform android --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Exercise actual Pixel taps and anonymous deep-link safeguards
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            python3 scripts/android-native-interaction-acceptance.py
      - name: Save Android real-touch screenshots and hierarchies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: american-rider-unsigned-android-smoke
          path: artifacts/android-native-interaction/
          if-no-files-found: ignore
