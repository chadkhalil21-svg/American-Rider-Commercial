name: QA isolated paired iOS XCTest transport probe

on:
  pull_request:
    branches:
      - qa/native-journey-stage-ledger-20261029
    paths:
      - .github/workflows/qa-ios-xctest-pair-probe.yml

jobs:
  paired-driver-probe:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select two iPhones from one installed simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','-j','devices','available']))
          choices=[]
          for runtime,devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              iphones=[d for d in devices if d.get('isAvailable') and 'iPhone' in d['name']]
              if len(iphones)>=2: choices.append((runtime,iphones))
          assert choices, 'No pair of available iOS simulator iPhones'
          runtime,iphones=sorted(choices,key=lambda p:p[0])[-1]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('QA_PROBE_OPERATOR='+iphones[0]['udid']+'\n')
              f.write('QA_PROBE_TRAVELER='+iphones[1]['udid']+'\n')
          print('PASS: two isolated iPhones share runtime',runtime)
          PY
      - name: Boot only the two selected simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$QA_PROBE_OPERATOR"
          xcrun simctl bootstatus "$QA_PROBE_OPERATOR" -b
          xcrun simctl boot "$QA_PROBE_TRAVELER"
          xcrun simctl bootstatus "$QA_PROBE_TRAVELER" -b
      - name: Install pinned Maestro used by failed commercial QA
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_VERSION=2.12.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Exercise both XCTest hierarchy transports with no payment or app fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa-ios-driver-probe
          cat > artifacts/qa-ios-driver-probe/settings.yml <<'FLOW'
          appId: com.apple.Preferences
          ---
          - launchApp:
              stopApp: false
          - assertVisible: "Settings"
          FLOW
          python3 - <<'PY'
          import os, pathlib, signal, subprocess, time
          root=pathlib.Path('artifacts/qa-ios-driver-probe')
          processes={}
          streams=[]
          for role,device,port in [('operator',os.environ['QA_PROBE_OPERATOR'],'7101'),
                                   ('traveler',os.environ['QA_PROBE_TRAVELER'],'7102')]:
              stream=(root/(role+'.log')).open('w')
              streams.append(stream)
              cmd=['maestro','--device',device,'--driver-host-port',port,'test',
                   '--test-output-dir='+str(root/('test-'+role)),
                   '--debug-output='+str(root/('debug-'+role)),
                   '--format','junit','--output',str(root/(role+'.xml')),
                   str(root/'settings.yml')]
              processes[role]=subprocess.Popen(cmd,stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
              print('QA_PROBE_STARTED',role,flush=True)
          deadline=time.monotonic()+540
          results={}
          try:
              while len(results)<len(processes):
                  for role,p in processes.items():
                      if role not in results and p.poll() is not None:
                          results[role]=p.returncode
                          print('QA_PROBE_RESULT',role,'exit',p.returncode,flush=True)
                  if any(code!=0 for code in results.values()):
                      print('QA_PROBE_BLOCKED: one XCTest session failed; retain both diagnostics',flush=True)
                      break
                  if time.monotonic()>=deadline:
                      print('QA_PROBE_TIMEOUT: driver readiness or hierarchy stalled',flush=True)
                      break
                  time.sleep(5)
          finally:
              for role,p in processes.items():
                  if p.poll() is None:
                      os.killpg(p.pid,signal.SIGTERM)
                      try: p.wait(timeout=8)
                      except subprocess.TimeoutExpired:
                          os.killpg(p.pid,signal.SIGKILL)
                  results.setdefault(role,p.returncode)
              for stream in streams: stream.close()
              with (root/'results.txt').open('w') as out:
                  for role,code in results.items(): out.write(role+': '+str(code)+'\n')
          assert len(results)==2 and all(code==0 for code in results.values()), 'Paired iOS driver transport not verified'
          print('PASS: both independent XCTest drivers completed Settings accessibility assertions')
          PY
      - name: Preserve independent XCTest and simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ios-xctest-pair-probe
          path: artifacts/qa-ios-driver-probe/
          if-no-files-found: warn
          retention-days: 14
