name: One-time backend dependency security repair (31 Oct 2026)
on:
  push:
    branches:
      - fix/verified-stripe-connect-fee-import-20261031
    paths:
      - .github/workflows/fix-backend-dependency-audit-once-20261031.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'chadkhalil21-svg/American-Rider-Commercial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-stripe-connect-fee-import-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only vulnerable production dependencies
        run: |
          set -euo pipefail
          npm ci --prefix backend
          npm audit fix --force --omit=dev --prefix backend
          npm audit --omit=dev --prefix backend
          for file in backend/package.json backend/package-lock.json; do
            test -f "$file"
          done
      - name: Confirm existing backend tests before committing
        run: |
          npm run lint --prefix backend
          node backend/connect-fee-importer.test.js
          node backend/connect-fee-daily-sweep.test.js
          node backend/verified-connect-fee-transfer.test.js
          node backend/referral-link-recovery-contract.test.js
      - name: Commit only lockfile and package manifest to this review branch
        run: |
          set -euo pipefail
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No production dependencies changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair audited backend production dependencies"
          git push origin HEAD:fix/verified-stripe-connect-fee-import-20261031
