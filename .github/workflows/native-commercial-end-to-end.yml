name: Full native commercial journeys - isolated iPhone and Android

on:
  pull_request:
    branches: [release/current]
    paths:
      - '.github/workflows/native-commercial-end-to-end.yml'
      - '.maestro/qa-commercial-*.yml'
      - 'backend/native-commercial-qa-*.cjs'
      - 'backend/native-qa-isolation.js'
      - 'scripts/native-commercial-env-preflight.cjs'
      - 'scripts/native-build-fingerprint.cjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # only for fetching earlier, checksum-verified QA simulator artifact

jobs:
  # GitHub's concurrency only cancels NEW runs sharing a group. The 2026-10-27
  # PR builds started before that group existed, so explicitly cancel their
  # obsolete run IDs before acquiring costly mobile build runners.
  retire-superseded-native-builds:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 383 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'qa/full-commercial-mobile-journeys-20261027' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      platforms: ${{ steps.cleanup.outputs.platforms }}
    steps:
      - name: Preserve an unfinished iOS build; cancel only superseded non-iOS work
        id: cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentSha = context.payload.pull_request.head.sha;
            const currentId = Number(context.runId);
            const workflow_id = 'native-commercial-end-to-end.yml';
            const obsolete = [];
            for (let page = 1; page <= 3; page++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: 'qa/full-commercial-mobile-journeys-20261027',
                per_page: 100, page,
              });
              for (const run of data.workflow_runs) {
                if (run.id === currentId || run.head_sha === currentSha) continue;
                if (!['queued','in_progress','waiting','pending','requested'].includes(run.status)) continue;
                if (run.head_branch !== 'qa/full-commercial-mobile-journeys-20261027') continue;
                obsolete.push(run.id);
              }
              if (data.workflow_runs.length < 100) break;
            }
            // IMPORTANT: cancelWorkflowRun cancels BOTH jobs of an older
            // matrix run. Do not throw away its expensive iOS compile just
            // because the previous Android job already failed. GitHub reports
            // individual job statuses through listJobsForWorkflowRun.
            const cancelled = [];
            const preservedIos = [];
            for (const run_id of obsolete) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id, per_page: 100
              });
              const unfinishedIos = jobs.some(j =>
                j.name === 'paid-native-journey (ios)' &&
                ['queued','in_progress','waiting','pending','requested'].includes(j.status)
              );
              if (unfinishedIos) {
                preservedIos.push(run_id);
                core.info('Preserving still-compiling iOS in older run '+run_id);
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id});
                cancelled.push(run_id);
                core.info('Cancellation requested for obsolete run '+run_id);
              } catch(error) {
                if (error.status !== 409 && error.status !== 422) throw error;
                core.info('Run already finished: '+run_id);
              }
            }
            // If another run owns an unfinished iOS build, test Android NOW
            // without scheduling a new iOS matrix job in the same concurrency
            // group (which would automatically cancel the still-compiling one).
            const platforms = preservedIos.length ? ['android'] : ['ios','android'];
            core.setOutput('platforms',JSON.stringify(platforms));
            await core.summary.addHeading('Native QA binary reuse')
              .addRaw('Preserved running iOS runs: '+preservedIos.join(', ') +
                '; cancelled superseded runs: '+cancelled.join(', ') +
                '; this run platforms: '+platforms.join(', '))
              .write();

  isolated-commercial-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse all live Stripe and production Firebase contexts, keep old sign-in QA safe
        run: node backend/native-qa-isolation.test.js
      - name: Validate native Android runner syntax before expensive builds
        run: bash -n scripts/native-commercial-android-runner.sh
      - name: Verify native Maestro password selectors before expensive builds
        run: node scripts/verify-native-maestro-selectors.cjs
      - name: Validate scoped Android emulator HTTP exception before expensive builds
        run: node scripts/native-qa-android-network.test.cjs

  paid-native-journey:
    needs: [retire-superseded-native-builds, isolated-commercial-safety]
    # A manual dispatch SKIPS the PR-specific cancellation job. GitHub's
    # default needs behavior would then skip BOTH device jobs forever.
    # Still fail closed unless the safety preflight actually passed.
    if: ${{ always() && needs.isolated-commercial-safety.result == 'success' && (needs.retire-superseded-native-builds.result == 'success' || needs.retire-superseded-native-builds.result == 'skipped') }}
    # Never hold the cleanup job itself behind a pre-concurrency build.
    concurrency:
      group: native-commercial-device-${{ github.event.pull_request.number || github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Preserve an older unfinished iOS build while immediately rebuilding
        # only the Android QA APK with its scoped Firebase emulator network XML.
        platform: ${{ fromJSON(needs.retire-superseded-native-builds.outputs.platforms || '["ios","android"]') }}
        include:
          - platform: ios
            os: macos-26
            local_url: http://127.0.0.1:4242
          - platform: android
            os: ubuntu-24.04
            local_url: http://10.0.2.2:4242
    runs-on: ${{ matrix.os }}
    timeout-minutes: 155
    env:
      CI: '1'
      NODE_ENV: test
      AR_NATIVE_PLATFORM: ${{ matrix.platform }}
      AR_NATIVE_QA_LOCAL: '1'
      AR_NATIVE_COMMERCIAL_QA: '1'
      EXPO_PUBLIC_AR_NATIVE_QA: '1'
      EXPO_PUBLIC_API_URL: ${{ matrix.local_url }}
      EXPO_PUBLIC_REFERRALS_ENABLED: '1'
      FIREBASE_PROJECT_ID: demo-american-rider-qa
      GOOGLE_CLOUD_PROJECT: demo-american-rider-qa
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || vars.STRIPE_TEST_PUBLISHABLE_KEY || vars.STRIPE_PUBLISHABLE_KEY }}
      PORT: '4242'
      MARKET_STATUS: fl-miami-dade:active
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce no production account, no provider live keys, and exact QA source
        shell: bash
        run: |
          set -euo pipefail
          test "$AR_NATIVE_QA_LOCAL" = 1
          test "$GOOGLE_CLOUD_PROJECT" = demo-american-rider-qa
          test -z "$(printenv STRIPE_LIVE_SECRET_KEY || true)"
          test -z "$(printenv K_SERVICE || true)"
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "::error::Only STRIPE_TEST_SECRET_KEY permitted"; exit 1;; esac
          case "$STRIPE_PUBLISHABLE_KEY" in pk_test_*) ;; *) echo "::error::Matching STRIPE_TEST_PUBLISHABLE_KEY is not configured"; exit 1;; esac
          git rev-parse HEAD
      - name: Install app/backend and Firebase emulator dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend --omit=dev
          npm ci --prefix infra/rules-emulator
      - name: Start disposable Firebase Auth/Firestore emulators
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),config=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          config.emulators={...(config.emulators||{}),
            auth:{host:'127.0.0.1',port:9099},firestore:{host:'127.0.0.1',port:8080}};
          fs.writeFileSync('firebase-qa-only.generated.json',JSON.stringify(config));
          NODE
          ./infra/rules-emulator/node_modules/.bin/firebase emulators:start --only auth,firestore --project demo-american-rider-qa --config firebase-qa-only.generated.json > "$RUNNER_TEMP/firebase-qa.log" 2>&1 &
          for i in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:9099/emulator/v1/projects/demo-american-rider-qa/config >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9099/emulator/v1/projects/demo-american-rider-qa/config >/dev/null
      - name: Provision disposable Traveler and eligible-test Operator in LOCAL Firebase and Stripe TEST
        shell: bash
        run: |
          set -euo pipefail
          node backend/native-commercial-qa-fixture.cjs | tee "$RUNNER_TEMP/fixture-result.txt"
          grep -q 'QA_NATIVE_FIXTURES_READY=1' "$RUNNER_TEMP/fixture-result.txt" || exit 1
      - name: Start actual local American Rider API and prove Stripe TEST readiness
        shell: bash
        run: |
          set -euo pipefail
          node backend/server.js > "$RUNNER_TEMP/local-commercial-api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4242/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4242/health >/dev/null || { tail -50 "$RUNNER_TEMP/local-commercial-api.log"; exit 1; }
          node scripts/native-commercial-env-preflight.cjs
      - name: Install Maestro real-screen interaction runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Fingerprint exact native application sources, excluding only QA scripts
        id: native-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          echo "digest=$(node scripts/native-build-fingerprint.cjs)" >> "$GITHUB_OUTPUT"
      - name: Restore precompiled unsigned QA app (never a production release)
        id: native-build-cache
        uses: actions/cache/restore@v4
        with:
          path: .qa-native-build-cache/${{ matrix.platform }}
          key: qa-native-release-v1-${{ runner.os }}-${{ matrix.platform }}-${{ steps.native-fingerprint.outputs.digest }}
      - name: Recover exact unchanged iOS simulator app from prior QA artifact
        # Cache reservation of the prior iOS binary lost a race, but the .app
        # was uploaded as an immutable checksummed artifact. Restore that
        # EXACT original build only when native source+QA env digest matches.
        if: matrix.platform == 'ios' && steps.native-build-cache.outputs.cache-hit != 'true' && steps.native-fingerprint.outputs.digest == 'ee65f1bd8f98d7f888b3676f46e8651fd7256aa4f75d1e8dc7fe7b00189311fb'
        id: recovered-ios-artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          artifact-ids: 12769200362
          run-id: 40569443959
          github-token: ${{ github.token }}
          path: .qa-native-build-cache/ios
      - name: Compile Android only when no identical APK is cached
        if: matrix.platform == 'android' && steps.native-build-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' || true
          NODE_ENV=production npx expo prebuild --platform android --clean --non-interactive
          # Android 9+ release packages block plain HTTP even to 10.0.2.2.
          # Only this disposable Android QA APK may reach LOCAL emulators.
          # Change neither app.json nor production network policy.
          node scripts/native-qa-android-network.cjs
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          # Test the ACTUAL compiled manifest, not merely the source XML.
          # Refuse caching/reusing any QA APK whose Android security policy
          # does not contain the deliberately local-only emulator exception.
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree app/build/outputs/apk/release/app-release.apk AndroidManifest.xml | grep -q 'networkSecurityConfig'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'res/xml/american_rider_qa_network_security_config.xml'
          mkdir -p ../.qa-native-build-cache/android
          cp app/build/outputs/apk/release/app-release.apk ../.qa-native-build-cache/android/app-release.apk
          cd ../.qa-native-build-cache/android
          shasum -a 256 app-release.apk > native.sha256
      - name: Verify Android app bytes before installation
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          cd .qa-native-build-cache/android
          test -s app-release.apk
          shasum -a 256 -c native.sha256
      - name: Save Android binary across QA-only test revisions
        if: matrix.platform == 'android' && steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .qa-native-build-cache/android
          key: qa-native-release-v1-${{ runner.os }}-${{ matrix.platform }}-${{ steps.native-fingerprint.outputs.digest }}
      - name: Preserve the exact Android APK independently of test results
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: commercial-qa-android-app
          path: .qa-native-build-cache/android/
          retention-days: 14
          if-no-files-found: error
      - name: Enable KVM for actual Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native Android Traveler and Operator paid journeys
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/native-commercial-android-runner.sh
      - name: Boot iPhone simulator and install cached or newly compiled app
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-commercial-ios .qa-native-build-cache/ios
          SIM="$(xcrun simctl list -j devices available | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(z["udid"] for a in d.values() for z in a if z.get("isAvailable") and "iPhone" in z["name"]))')"
          echo "SIM_DEVICE=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl location "$SIM" set 25.7617,-80.1918
          # Check the restored iOS artifact *before* deciding to spend on Xcode.
          # Fail closed if the archive exists but its own SHA is wrong.
          if [[ -s .qa-native-build-cache/ios/AmericanRider.app.tgz ]]; then
            (cd .qa-native-build-cache/ios && shasum -a 256 -c native.sha256)
            echo 'Using proven iOS QA binary instead of recompiling unchanged source'
          else
            NODE_ENV=production npx expo prebuild --clean --platform ios --non-interactive
            NODE_ENV=production xcodebuild -workspace ios/AmericanRider.xcworkspace -scheme AmericanRider -configuration Release -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/QARelease" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > artifacts/native-commercial-ios/xcode.log 2>&1 || { tail -120 artifacts/native-commercial-ios/xcode.log; exit 1; }
            APP="$RUNNER_TEMP/QARelease/Build/Products/Release-iphonesimulator/AmericanRider.app"
            test -d "$APP"
            tar -czf .qa-native-build-cache/ios/AmericanRider.app.tgz -C "$(dirname "$APP")" AmericanRider.app
            (cd .qa-native-build-cache/ios && shasum -a 256 AmericanRider.app.tgz > native.sha256)
          fi
          cd .qa-native-build-cache/ios
          test -s AmericanRider.app.tgz
          shasum -a 256 -c native.sha256
          mkdir -p "$RUNNER_TEMP/qa-cached-ios"
          tar -xzf AmericanRider.app.tgz -C "$RUNNER_TEMP/qa-cached-ios"
          test -d "$RUNNER_TEMP/qa-cached-ios/AmericanRider.app"
          xcrun simctl install "$SIM" "$RUNNER_TEMP/qa-cached-ios/AmericanRider.app"
      - name: Save iOS simulator app across QA-only test revisions
        if: matrix.platform == 'ios' && steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .qa-native-build-cache/ios
          key: qa-native-release-v1-${{ runner.os }}-${{ matrix.platform }}-${{ steps.native-fingerprint.outputs.digest }}
      - name: Preserve exact iOS simulator app independently of test results
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: commercial-qa-ios-simulator-app
          path: .qa-native-build-cache/ios/
          retention-days: 14
          if-no-files-found: error
      - name: Execute native iPhone Traveler and Operator paid journeys
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/qa-commercial-traveler.yml > artifacts/native-commercial-ios/traveler.log 2>&1 || { tail -75 artifacts/native-commercial-ios/traveler.log; mkdir -p artifacts/native-commercial-ios/maestro-debug; cp -R "$HOME/.maestro/tests/." artifacts/native-commercial-ios/maestro-debug/ 2>/dev/null || true; xcrun simctl io "$SIM_DEVICE" screenshot artifacts/native-commercial-ios/failure-screen.png || true; exit 1; }
          maestro test .maestro/qa-commercial-operator.yml > artifacts/native-commercial-ios/operator.log 2>&1 || { tail -75 artifacts/native-commercial-ios/operator.log; mkdir -p artifacts/native-commercial-ios/maestro-debug; cp -R "$HOME/.maestro/tests/." artifacts/native-commercial-ios/maestro-debug/ 2>/dev/null || true; xcrun simctl io "$SIM_DEVICE" screenshot artifacts/native-commercial-ios/failure-screen.png || true; exit 1; }
          node backend/native-commercial-qa-reconcile.cjs
      - name: Preserve platform evidence even when full journey fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-commercial-${{ matrix.platform }}-evidence
          path: |
            artifacts/native-commercial-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Explain non-certification boundary
        if: always()
        run: |
          echo 'Native end-to-end passes ONLY if Traveler+Operator on-device workflows AND the same local Firestore Travel/actual Stripe TEST transfer reconciliation all succeed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No fake live Operator, legal commercial insurance, real payout bank arrival, App Store review, signed device entitlement, or Recruiter bank funding is asserted.' >> "$GITHUB_STEP_SUMMARY"
