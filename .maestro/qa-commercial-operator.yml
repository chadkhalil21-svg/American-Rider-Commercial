# Same isolated backend/Travel as Traveler flow. Require actual Operator interaction.
appId: com.americanrider.app
---
- launchApp:
    clearState: true
- tapOn: "Email Address"
- inputText: "native.qa.operator@example.test"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- tapOn: "Password"
- inputText: "Native-QA-Only-7819-Strong"
# On Android Maestro hideKeyboard dispatches BACK. After password input,
# submit by pressing the keyboard action key wired to TextInput.onSubmitEditing.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Welcome back"
      - pressKey: enter
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
      - tapOn:
          id: "auth-primary-action"
- openLink: "americanrider:///operator"
# The fixture may be eligible at the SERVER, but on-device Operator duty
# must still be explicitly commenced by tapping the real native control.
- extendedWaitUntil:
    visible: "Commence Operations"
    timeout: 90000
- tapOn: "Commence Operations"
- extendedWaitUntil:
    visible: "Accept Traveler"
    timeout: 90000
- tapOn: "Accept Traveler"
- extendedWaitUntil:
    visible: "Confirm Arrival"
    timeout: 60000
- tapOn: "Confirm Arrival"
- extendedWaitUntil:
    visible: "Commence Travel"
    timeout: 60000
- tapOn: "Commence Travel"
- extendedWaitUntil:
    visible: "Complete Operation"
    timeout: 60000
- tapOn: "Complete Operation"
- extendedWaitUntil:
    visible: "Operation Complete"
    timeout: 60000
