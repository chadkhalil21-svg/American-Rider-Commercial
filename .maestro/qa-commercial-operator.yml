# Same isolated backend/Travel as Traveler flow. Require actual Operator interaction.
appId: com.americanrider.app
---
- launchApp:
    clearState: true
- assertVisible: "AMERICAN RIDER"
# iOS simulator screenshot (run 40702841352) showed only "n" in the email
# field after Maestro reported full inputText success. Use the same proven
# native input ID and clipboard paste as the iOS Traveler flow. Keep Android
# on its previously passing keyboard path.
- tapOn:
    id: "auth-email-entry"
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "native.qa.operator@example.test"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "native.qa.operator@example.test"
      - pasteText
# Android back dismisses the keyboard. iOS hideKeyboard uses a swipe and
# previously FAILED before the account could proceed (run 40592170783).
# Tap a visible, non-interactive native title instead on iOS.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "AMERICAN RIDER"
# A text-only "Continue" tap on the Operator path repeatedly completed
# without reaching Sign In, while Traveler already used this stable test ID.
# Confirm the *actual entered address* instead of only nonempty input.
# Apple's accessibilityLabel is the field prompt, not necessarily its value.
# Maestro's official copyTextFrom example reads the actual editable content.
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom:
          id: "auth-email-entry"
      # Run 40879383424 captured the actual iPhone with an EMPTY email after
      # Maestro reported pasteText COMPLETED. That is a keyboard/input fault,
      # not failed Firebase sign-in or an Operator eligibility verdict.
      # Recover ONCE, only at the pre-auth editable field, and refuse to
      # continue unless the exact entered value is then independently read.
      - runFlow:
          when:
            true: ${maestro.copiedText !== "native.qa.operator@example.test"}
          commands:
            - tapOn:
                id: "auth-email-entry"
            - eraseText: 50
            - inputText: "native.qa.operator@example.test"
            - tapOn: "AMERICAN RIDER"
      - copyTextFrom:
          id: "auth-email-entry"
      # Preserve actual native input before a failed assertion closes Step 31.
      # Every value here is a synthetic local QA identity, never live credentials.
      - takeScreenshot: "qa-operator-email-before-final-assert"
      - assertTrue:
          condition: ${maestro.copiedText === "native.qa.operator@example.test"}
          label: "QA_OPERATOR_EMAIL_NOT_PRESENT_IN_EDITABLE_FIELD"
- assertVisible:
    id: "auth-primary-action"
    enabled: true
- tapOn:
    id: "auth-primary-action"
    enabled: true
    retryTapIfNoChange: true
# The next view is uniquely identified by its Sign In subheading.
# An old check for "Welcome back" matched a static title and gave no
# actionable distinction between input, transition and wrong auth step.
- extendedWaitUntil:
    visible: "Sign in to your account."
    timeout: 30000
- assertVisible: "Sign in to your account."
- assertNotVisible: "Create your account"
# Use the password EditText hint, not the static PASSWORD label.
- tapOn: "Your password"
- inputText: "Native-QA-Only-7819-Strong"
# Maestro official known issue: iOS hideKeyboard relies on a swipe and can
# FAIL without any app defect. Android uses its system Back dismissal.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      # Tap a harmless static heading rather than invoke flaky iOS hideKeyboard.
      - tapOn: "Sign in to your account."
# The shared InkButton id is NOT enough to prove Sign In: also assert label.
- assertVisible: "Sign In"
- assertVisible:
    id: "auth-primary-action"
    enabled: true
- tapOn:
    id: "auth-primary-action"
# Guard against invisible-route matches while the credential form remains.
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
- openLink: "americanrider:///operator"
# The fixture may be eligible at the SERVER, but on-device Operator duty
# must still be explicitly commenced by tapping the real native control.
- extendedWaitUntil:
    visible: "Commence Operations"
    timeout: 90000
- tapOn: "Commence Operations"
- extendedWaitUntil:
    visible: "Accept Traveler"
    timeout: 90000
- tapOn: "Accept Traveler"
- extendedWaitUntil:
    visible: "Confirm Arrival"
    timeout: 60000
- tapOn: "Confirm Arrival"
- extendedWaitUntil:
    visible: "Commence Travel"
    timeout: 60000
- tapOn: "Commence Travel"
- extendedWaitUntil:
    visible: "Complete Operation"
    timeout: 60000
- tapOn: "Complete Operation"
- extendedWaitUntil:
    visible: "Operation Complete"
    timeout: 60000
