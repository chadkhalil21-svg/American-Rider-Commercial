# Same isolated backend/Travel as Traveler flow. Require actual Operator interaction.
appId: com.americanrider.app
---
- launchApp:
    clearState: true
- assertVisible: "AMERICAN RIDER"
# iOS simulator screenshot (run 40702841352) showed only "n" in the email
# field after Maestro reported full inputText success. Use the same proven
# native input ID and clipboard paste as the iOS Traveler flow. Keep Android
# on its previously passing keyboard path.
- tapOn:
    id: "auth-email-entry"
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "native.qa.operator@example.test"
- runFlow:
    when:
      platform: iOS
    commands:
      - setClipboard: "native.qa.operator@example.test"
      - pasteText
# Android back dismisses the keyboard. iOS hideKeyboard uses a swipe and
# previously FAILED before the account could proceed (run 40592170783).
# Tap a visible, non-interactive native title instead on iOS.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "AMERICAN RIDER"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
# iOS evidence from run 40569443959 showed CREATE ACCOUNT in front
# although a text-only "Welcome back" assertion passed. Require the
# Sign In page to be foreground; never enter a password on signup.
- assertVisible: "Sign in to your account."
- assertNotVisible: "Create your account"
# Use the password EditText hint, not the static PASSWORD label.
- tapOn: "Your password"
- inputText: "Native-QA-Only-7819-Strong"
# Maestro official known issue: iOS hideKeyboard relies on a swipe and can
# FAIL without any app defect. Android uses its system Back dismissal.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      # Tap a harmless static heading rather than invoke flaky iOS hideKeyboard.
      - tapOn: "Sign in to your account."
# The shared InkButton id is NOT enough to prove Sign In: also assert label.
- assertVisible: "Sign In"
- assertVisible:
    id: "auth-primary-action"
    enabled: true
- tapOn:
    id: "auth-primary-action"
# Guard against invisible-route matches while the credential form remains.
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
- openLink: "americanrider:///operator"
# The fixture may be eligible at the SERVER, but on-device Operator duty
# must still be explicitly commenced by tapping the real native control.
- extendedWaitUntil:
    visible: "Commence Operations"
    timeout: 90000
- tapOn: "Commence Operations"
- extendedWaitUntil:
    visible: "Accept Traveler"
    timeout: 90000
- tapOn: "Accept Traveler"
- extendedWaitUntil:
    visible: "Confirm Arrival"
    timeout: 60000
- tapOn: "Confirm Arrival"
- extendedWaitUntil:
    visible: "Commence Travel"
    timeout: 60000
- tapOn: "Commence Travel"
- extendedWaitUntil:
    visible: "Complete Operation"
    timeout: 60000
- tapOn: "Complete Operation"
- extendedWaitUntil:
    visible: "Operation Complete"
    timeout: 60000
