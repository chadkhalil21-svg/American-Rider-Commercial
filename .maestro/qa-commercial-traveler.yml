# Actual native application: Traveler -> destination -> authorized Stripe TEST booking.
# Runs ONLY against isolated local Firebase/Auth and sandbox API.
appId: com.americanrider.app
---
- launchApp:
    clearState: true
- assertVisible: "AMERICAN RIDER"
- tapOn: "Email Address"
- inputText: "native.qa.traveler@example.test"
# Android back dismisses the keyboard. iOS hideKeyboard uses a swipe and
# previously FAILED before the account could proceed (run 40592170783).
# Tap a visible, non-interactive native title instead on iOS.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "AMERICAN RIDER"
- tapOn: "Continue"
- assertVisible: "Welcome back"
# iOS evidence from run 40569443959 showed CREATE ACCOUNT in front
# although a text-only "Welcome back" assertion passed. Require the
# Sign In page to be foreground; never enter a password on signup.
- assertVisible: "Sign in to your account."
- assertNotVisible: "Create your account"
# The emulator's native hierarchy exposes PASSWORD as a static heading.
# Input target is the editable field whose hint is "Your password".
- tapOn: "Your password"
- inputText: "Native-QA-Only-7819-Strong"
# Maestro official known issue: iOS hideKeyboard relies on a swipe and can
# FAIL without any app defect. Android uses its system Back dismissal.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      # Tap a harmless static heading rather than invoke flaky iOS hideKeyboard.
      - tapOn: "Sign in to your account."
# The shared InkButton id is NOT enough to prove Sign In: also assert label.
- assertVisible: "Sign In"
- assertVisible:
    id: "auth-primary-action"
    enabled: true
- tapOn:
    id: "auth-primary-action"
# The last iPhone run (40549821639) incorrectly matched an underlying
# Arrange Your Travel view while the Welcome back screen was still foreground.
# Require the login form to disappear BEFORE accepting any home-screen match.
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
- extendedWaitUntil:
    visible: "Arrange Your Travel"
    timeout: 60000
# The server-owned local fixture includes Wynwood (not MIA Airport), so
# core commercial checkout does not depend on an unconfigured HERE/Photon
# account. Airport pickup/drop-off compliance is a SEPARATE acceptance test.
- tapOn: "Select your destination"
- extendedWaitUntil:
    visible: "Search a place or address"
    timeout: 15000
- tapOn: "Search a place or address"
- inputText: "Wynwood"
# GitHub run 40601800241 proved a bare "Wynwood" selector was the
# still-focused EDITABLE INPUT, not the destination suggestion. The iOS
# accessibility hierarchy exposed the real result-row BUTTON as
# "Wynwood, Estimated travel time · 11 minutes, ›".
# Match the row's metadata so a similarly named TextInput is never clicked.
- extendedWaitUntil:
    visible: ".*Wynwood, Estimated travel time.*"
    timeout: 40000
- tapOn: ".*Wynwood, Estimated travel time.*"
# The title "Travel Confirmation" also appears while in edit/search mode.
# Require the editing search field to disappear before accepting a quote.
- extendedWaitUntil:
    notVisible: "Search a place or address"
    timeout: 20000
- extendedWaitUntil:
    visible: "Complete Travel Cost"
    timeout: 60000
- assertVisible:
    text: "Confirm Travel"
    enabled: true
- tapOn: "Confirm Travel"
- extendedWaitUntil:
    visible: "Card"
    timeout: 45000
# Real Android/iOS Stripe PaymentSheet evidence in runs 40625765922 and
# 40625766005 shows a payment-method picker (Card, Link, etc.) first.
# Card number is not visible until the Traveler explicitly chooses Card.
- tapOn: "New card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 45000
# The Stripe TEST PaymentSheet card entry and authenticated authorization must
# be completed on-device. This suite fails rather than claiming success if the
# PaymentSheet does not appear or the eligible Operator is not available.
- tapOn: "Card number"
- inputText: "4242424242424242"
# Android Stripe labels the expiry control by accessible purpose, not the
# visual MM / YY placeholder. Captured in run 40627439913 screenshot/UI tree.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ".*Expiration date.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "MM / YY"
- inputText: "1230"
- tapOn: "CVC"
- inputText: "123"
# Stripe TEST PaymentSheet on Android requires billing ZIP before Pay unlocks.
# Screenshot and real hierarchy: run 40628842991, evidence 12791295242.
- tapOn: "ZIP Code"
- inputText: "33130"
# The native button includes a server-owned amount (Pay $10.57 in this fixture).
# Require enabled=true. Do not tap or claim payment while it is disabled.
- extendedWaitUntil:
    visible:
      id: "com.americanrider.app:id/primary_button"
      enabled: true
    timeout: 20000
- tapOn:
    id: "com.americanrider.app:id/primary_button"
    enabled: true
- extendedWaitUntil:
    visible: "Awaiting Operator confirmation"
    timeout: 60000
